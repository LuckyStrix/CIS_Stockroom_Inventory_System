[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-stockroom"
version = "1.0.0"
description = "Inventory management for the RIT Carlson Center for Imaging Science stockroom"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-barcode>=0.15",
    "Pillow>=10",
]

# Single sign-on is opt-in. python3-saml pulls in lxml and xmlsec, which are
# native extensions -- a normal install on a Pi should not pay for them, and
# the application starts and runs without them (config.AUTH_MODE=password).
[project.optional-dependencies]
sso = ["python3-saml>=1.16"]

[project.scripts]
stockroom = "stockroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schema_fts.sql matters as much as schema.sql: without it an installed copy
# silently has no search index and falls back to LIKE forever.
stockroom = ["schema.sql", "schema_fts.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:stockroom.*"]
