# nginx in front of the stockroom app.
#
# Two jobs: terminate TLS, and be the only thing that can talk to uvicorn.
# The app binds 127.0.0.1 and is never directly reachable, which is what makes
# it safe for the app to trust the X-Forwarded-* headers set below.
#
# Install to /etc/nginx/sites-available/stockroom and symlink into
# sites-enabled. deploy/setup-pi.sh does this for you.

# Plain HTTP exists only to redirect. Credentials must never cross the LAN in
# the clear, and an http:// bookmark should not silently keep working.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let the public inventory page work over plain HTTP: it carries no
    # credentials and no personal data, and making it work everywhere is the
    # entire point of publishing it.
    location /public/ {
        alias /var/lib/stockroom/publish/;
        # Not on disk: send the browser to HTTPS rather than answering with
        # nginx's own 404, which is indistinguishable from "there is no site
        # here". The application answers /public/ over there and says which it
        # actually is -- see the note in the 443 block.
        try_files $uri $uri/index.html @redirect;
        add_header Cache-Control "no-cache";
    }

    location @redirect {
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    # Answer on whatever address the request arrived at -- the .local name, a
    # DNS alias, or the bare IP that a phone with no mDNS resolver has to use.
    # Naming a specific host here only looks stricter: this is the sole server
    # block on 443, so nginx already serves it as the default for any Host.
    # The real Host check is the application's, which reports what it rejected
    # and how to allow it (STOCKROOM_ALLOWED_HOSTS).
    server_name _;

    ssl_certificate     /etc/ssl/stockroom/stockroom.crt;
    ssl_certificate_key /etc/ssl/stockroom/stockroom.key;

    # TLS 1.2+ only, forward secrecy, no legacy ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A stockroom photo or a CSV import, with room to spare. Anything larger is
    # a mistake or an attempt to exhaust memory.
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Do not advertise the exact nginx version to anyone scanning the LAN.
    server_tokens off;

    access_log /var/log/nginx/stockroom-access.log;
    error_log  /var/log/nginx/stockroom-error.log;

    # How to talk to the application, for every location that does. Set here
    # at server level rather than inside `location /`, so that the /public/
    # fallback below cannot drift away from it.
    #
    # Careful: proxy_set_header does not merge. A location that sets one
    # header of its own inherits NONE of these -- it would have to repeat the
    # whole list, X-Shib-* included.
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    # The app reads this to decide whether to mark cookies Secure and to
    # send HSTS. Set explicitly (not $proxy_add_x_forwarded_proto) so a
    # client-supplied header can never be passed through.
    proxy_set_header X-Forwarded-Proto https;

    # Clear identity headers that a client might send. The application
    # does not read these today -- support was removed deliberately -- but
    # if SSO is added later and they are trusted, an unset header here is
    # the difference between authentication and anyone typing a name.
    # An empty value stops the header being forwarded at all.
    proxy_set_header X-Shib-Mail "";
    proxy_set_header X-Shib-DisplayName "";
    proxy_set_header X-Remote-User "";

    proxy_read_timeout 60s;
    proxy_redirect off;

    # The generated public page, served straight from disk -- it never needs
    # to wake the application.
    location /public/ {
        alias /var/lib/stockroom/publish/;
        # ...unless the file is not there, in which case the application gets
        # the request. Two different faults land here and a bare nginx 404
        # tells you neither: the page has never been generated (nothing has
        # been checked in or out yet, or `stockroom publish` has not run), or
        # STOCKROOM_PUBLISH_DIR no longer names the directory this alias
        # points at. The app reads config.PUBLISH_DIR per request, so it
        # serves the page in the second case and explains itself in the first.
        try_files $uri $uri/index.html @app;
        add_header Cache-Control "no-cache";
    }

    location @app {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
